name: Verify public source

on:
  push:
    branches: [main]
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Vendor/**'
      - 'scripts/**'
      - 'MingSi.xcodeproj/**'
      - 'project.yml'
      - '.github/workflows/verify.yml'
  pull_request:
    paths:
      - 'Sources/**'
      - 'Tests/**'
      - 'Vendor/**'
      - 'scripts/**'
      - 'MingSi.xcodeproj/**'
      - 'project.yml'
      - '.github/workflows/verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-verification:
    name: Clean build and offline tests
    runs-on: macos-26
    # A clean Release, Debug/unit run and eight UI paths exceeded 45 minutes
    # on a slow hosted simulator. Keep the full gates and artifact collection.
    timeout-minutes: 75
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
    steps:
      - name: Check out public source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Record source and toolchain
        run: |
          git rev-parse HEAD
          git status --short
          test -z "$(git status --porcelain)"
          xcodebuild -version
          xcrun swift --version
          python3 --version
      - name: Verify local scripts without model credentials
        run: |
          python3 -m unittest discover -s Tests/Scripts -p 'test_*.py' -v
          for script in scripts/*.sh; do bash -n "$script"; done
          git diff --check
      - name: Build Release for Simulator
        run: |
          xcodebuild -project MingSi.xcodeproj -scheme MingSi \
            -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/mingsi-release" \
            CODE_SIGNING_ALLOWED=NO MINGSI_SOURCE_REVISION="$GITHUB_SHA" MINGSI_SOURCE_STATE=clean build
          test "$(plutil -extract MingSiSourceRevision raw -o - "$RUNNER_TEMP/mingsi-release/Build/Products/Release-iphonesimulator/MingSi.app/Info.plist")" = "$GITHUB_SHA"
          test "$(plutil -extract MingSiSourceState raw -o - "$RUNNER_TEMP/mingsi-release/Build/Products/Release-iphonesimulator/MingSi.app/Info.plist")" = "clean"
      - name: Select existing runner iPhone
        run: |
          # Hosted runners have different device IDs from the maintainer's Mac.
          # Inspect existing devices; do not create, delete or reset a simulator.
          python3 scripts/select_ci_simulator.py >> "$GITHUB_ENV"
      - name: Run unit tests with no paid model requests
        id: offline-unit
        run: |
          xcodebuild -project MingSi.xcodeproj -scheme MingSi \
            -configuration Debug -destination "platform=iOS Simulator,id=$MINGSI_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/mingsi-tests" \
            -resultBundlePath "$RUNNER_TEMP/mingsi-tests.xcresult" \
            -parallel-testing-enabled NO -only-testing:MingSiTests \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            MINGSI_SOURCE_REVISION="$GITHUB_SHA" MINGSI_SOURCE_STATE=clean test
          test "$(plutil -extract MingSiSourceRevision raw -o - "$RUNNER_TEMP/mingsi-tests/Build/Products/Debug-iphonesimulator/MingSi.app/Info.plist")" = "$GITHUB_SHA"
          test "$(plutil -extract MingSiSourceState raw -o - "$RUNNER_TEMP/mingsi-tests/Build/Products/Debug-iphonesimulator/MingSi.app/Info.plist")" = "clean"
      - name: Check optional HealthKit entitlement embedded for Simulator
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import plistlib
          import re
          import subprocess
          app = Path(os.environ["RUNNER_TEMP"]) / "mingsi-tests/Build/Products/Debug-iphonesimulator/MingSi.app"
          # Xcode embeds simulator entitlements in Mach-O, separately from the
          # ad-hoc code signature. otool prints arm64 data as little-endian words.
          dump = subprocess.check_output(["xcrun", "otool", "-arch", "arm64", "-X", "-s",
                                          "__TEXT", "__entitlements", str(app / "MingSi")], text=True)
          words = [word for line in dump.splitlines() if re.match(r"^[0-9a-fA-F]{16}\s", line)
                   for word in line.split()[1:]]
          assert words and all(re.fullmatch(r"(?:[0-9a-fA-F]{2}){1,4}", word) for word in words)
          payload = b"".join(int(word, 16).to_bytes(len(word) // 2, "little") for word in words).rstrip(b"\0")
          assert plistlib.loads(payload).get("com.apple.developer.healthkit") is True
          info = plistlib.loads((app / "Info.plist").read_bytes())
          required = info.get("UIRequiredDeviceCapabilities", [])
          assert "healthkit" not in required, "HealthKit must remain optional"
          print("Simulator executable embeds optional HealthKit entitlement; no health authorization or data access performed")
          PY
      - name: Run isolated permission and next-turn UI in light and dark largest text
        # Preserve a failed unit gate while still collecting independent UI
        # evidence. No continue-on-error: the overall job remains failed.
        if: ${{ !cancelled() && (steps.offline-unit.outcome == 'success' || steps.offline-unit.outcome == 'failure') }}
        run: |
          xcodebuild -project MingSi.xcodeproj -scheme MingSi \
            -configuration Debug -destination "platform=iOS Simulator,id=$MINGSI_CI_SIMULATOR_ID" \
            -derivedDataPath "$RUNNER_TEMP/mingsi-tests" \
            -resultBundlePath "$RUNNER_TEMP/mingsi-permissions-ui.xcresult" \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 600 -maximum-test-execution-time-allowance 600 \
            -only-testing:MingSiUITests/MingSiUITests/testPermissionStatesAndFailureInLight \
            -only-testing:MingSiUITests/MingSiUITests/testPermissionStatesAndFailureInDarkLargest \
            -only-testing:MingSiUITests/MentorNavigationUITests/testSavedNetworkResponseAllowsNextInputWithoutBenefitFeedback \
            -only-testing:MingSiUITests/MentorNavigationUITests/testSavedNetworkResponseAllowsNextInputAtLargestDarkText \
            -only-testing:MingSiUITests/MentorNavigationUITests/testActiveConversationKeyboardKeepsInputAndExitReachable \
            -only-testing:MingSiUITests/MentorNavigationUITests/testBottomComposerReviewsSpeechWithoutLosingTypedDraftAtLargestText \
            -only-testing:MingSiUITests/MentorNavigationUITests/testMethodLibrarySelectionAndHeldSourceAreReachableInNormalAndLargestDarkText \
            -only-testing:MingSiUITests/MentorNavigationUITests/testMentorBenefitFeedbackUsesSharedVoiceInput \
            -only-testing:MingSiUITests/MentorNavigationUITests/testMentorFeedbackUsesSameVoiceLifecycleAndKeepsTypedDraft \
            -only-testing:MingSiUITests/MentorNavigationUITests/testMentorStreamShowsGrowingPreviewThenValidatedAnswer \
            -only-testing:MingSiUITests/MentorNavigationUITests/testInterruptedMentorStreamKeepsCopyablePreviewAtLargestDarkText \
            -collect-test-diagnostics never \
            CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- \
            MINGSI_SOURCE_REVISION="$GITHUB_SHA" MINGSI_SOURCE_STATE=clean test
      - name: Save test counts
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/mingsi-tests.xcresult/Info.plist" ]]; then
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/mingsi-tests.xcresult" --format json \
              > "$RUNNER_TEMP/mingsi-unit-summary.json"
            cat "$RUNNER_TEMP/mingsi-unit-summary.json" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f "$RUNNER_TEMP/mingsi-permissions-ui.xcresult/Info.plist" ]]; then
            mkdir -p "$RUNNER_TEMP/permission-ui-evidence"
            xcrun xcresulttool get test-results summary \
              --path "$RUNNER_TEMP/mingsi-permissions-ui.xcresult" --format json \
              > "$RUNNER_TEMP/permission-ui-evidence/summary.json"
            cat "$RUNNER_TEMP/permission-ui-evidence/summary.json" >> "$GITHUB_STEP_SUMMARY"
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/mingsi-permissions-ui.xcresult" \
              --output-path "$RUNNER_TEMP/permission-ui-attachments"
            python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import shutil
          task_temp = Path(os.environ["RUNNER_TEMP"])
          exported = task_temp / "permission-ui-attachments"
          evidence = task_temp / "permission-ui-evidence"
          mapping = []
          for test in json.loads((exported / "manifest.json").read_text()):
              for attachment in test["attachments"]:
                  filename = Path(attachment["exportedFileName"]).name
                  if Path(filename).suffix.lower() != ".png":
                      continue
                  output_name = str(len(mapping)) + "-" + filename
                  shutil.copy2(exported / filename, evidence / output_name)
                  mapping.append({"file": output_name, "name": attachment["suggestedHumanReadableName"],
                                  "test": test["testIdentifier"]})
          (evidence / "screenshots.json").write_text(json.dumps(mapping, indent=2) + "\n")
          PY
          fi
      - name: Package verified simulator App for normal local validation
        # Preserve the same Debug bundle that passed offline and UI gates.
        # No device data, Keychain, API credentials or simulator container is
        # packaged. This is a simulator artifact, never an iPhone distribution.
        if: success()
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import plistlib
          import subprocess
          task_temp = Path(os.environ["RUNNER_TEMP"])
          app = task_temp / "mingsi-tests/Build/Products/Debug-iphonesimulator/MingSi.app"
          info = plistlib.loads((app / "Info.plist").read_bytes())
          revision = os.environ["GITHUB_SHA"]
          assert subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() == revision
          assert info["MingSiSourceRevision"] == revision
          assert info["MingSiSourceState"] == "clean"
          assert info["CFBundleIdentifier"] == "com.codex.mingsi"
          assert "iPhoneSimulator" in info["CFBundleSupportedPlatforms"]
          unit = json.loads((task_temp / "mingsi-unit-summary.json").read_text())
          ui = json.loads((task_temp / "permission-ui-evidence/summary.json").read_text())
          assert unit["failedTests"] == 0 and unit["passedTests"] > 0
          assert ui["failedTests"] == 0 and ui["passedTests"] == 11
          evidence = task_temp / "verified-simulator-app"
          evidence.mkdir()
          archive = evidence / "MingSi-simulator.zip"
          subprocess.run(["ditto", "-c", "-k", "--sequesterRsrc", "--keepParent", str(app), str(archive)], check=True)
          manifest = {"platform": "iPhoneSimulator", "configuration": "Debug",
                      "source_revision": revision,
                      "source_tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                      "source_state": "clean", "bundle_id": info["CFBundleIdentifier"],
                      "archive_sha256": hashlib.sha256(archive.read_bytes()).hexdigest(),
                      "unit": {key: unit[key] for key in ["passedTests", "failedTests", "skippedTests"]},
                      "ui": {key: ui[key] for key in ["passedTests", "failedTests", "skippedTests"]},
                      "scope": "CI simulator only; no phone, personal data or provider validation"}
          (evidence / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          PY
      - name: Attach verified simulator App
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verified-simulator-app
          path: ${{ runner.temp }}/verified-simulator-app
          if-no-files-found: error
          retention-days: 7
      - name: Attach compact test summary
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-summary
          path: ${{ runner.temp }}/mingsi-unit-summary.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Attach isolated permission UI counts and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: permission-ui-evidence
          path: ${{ runner.temp }}/permission-ui-evidence
          if-no-files-found: ignore
          retention-days: 14
