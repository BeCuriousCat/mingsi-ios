name: MingSi
options:
  bundleIdPrefix: com.codex
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
packages:
  GRDB:
    path: Vendor/GRDB.swift
targets:
  MingSi:
    type: application
    platform: iOS
    sources:
      - path: Sources
    dependencies:
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.mingsi
        INFOPLIST_KEY_CFBundleDisplayName: 明思
        MINGSI_SOURCE_REVISION: unknown
        MINGSI_SOURCE_STATE: unknown
        INFOPLIST_KEY_MingSiSourceRevision: "$(MINGSI_SOURCE_REVISION)"
        INFOPLIST_KEY_MingSiSourceState: "$(MINGSI_SOURCE_STATE)"
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 明思仅使用粗略位置情境生成可选生活奇遇。
        INFOPLIST_KEY_NSCameraUsageDescription: 明思仅在你选择为生活奇遇留下一张照片时使用相机。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 明思仅在你选择照片附到生活奇遇时读取所选照片。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 明思仅在你拍下生活奇遇照片时，将它保存到“明思·奇遇”相册。
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: 明思仅在你主动授权后读取日历，将忙闲状态用于可选生活奇遇；不会修改日历或上传事件原文。
        INFOPLIST_KEY_NSHealthShareUsageDescription: 明思仅在你主动授权后，将近期步数、活动和睡眠归约为粗略状态，用于生成可选生活奇遇；不会上传健康样本或具体数值。
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: 明思不会写入健康数据。
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 明思仅在你点按麦克风后使用麦克风，将语音转换为可编辑文字。
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: 明思仅在你点按麦克风后，将语音转换为可编辑文字。
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: "$(inherited) mentor-lessons-m1.draft.json life-guidance-m1.draft.json"
  MingSiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - UI
    dependencies:
      - target: MingSi
      - package: GRDB
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.mingsi.tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
  MingSiUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: Tests/UI
    dependencies:
      - target: MingSi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.codex.mingsi.uitests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: ""
schemes:
  MingSi:
    build:
      targets:
        MingSi: all
    test:
      targets:
        - MingSiTests
        - MingSiUITests
